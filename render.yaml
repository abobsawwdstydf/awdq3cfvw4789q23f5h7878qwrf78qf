services:
  - type: web
    name: nexo-messenger
    env: node
    region: frankfurt
    plan: starter
    branch: main
    rootDir: render-server
    buildCommand: npm install && npx prisma generate
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: neon-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: redis-cloud
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: DISCORD_WEBHOOK_URLS
        sync: false
      - key: TELEGRAM_BOT_TOKENS
        sync: false
      - key: TELEGRAM_CHANNEL_IDS
        sync: false
      - key: MAX_FILE_SIZE
        value: "53687091200"
      - key: CHUNK_SIZE
        value: "19922944"
      - key: MAX_REGISTRATIONS_PER_IP
        value: "22"
      - key: STUN_URLS
        value: "stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302"

databases:
  - name: neon-db
    databaseUrl: ${NEON_DATABASE_URL}
  - name: redis-cloud
    databaseUrl: ${REDIS_URL}
